<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Forjadores — Eventos</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 640px; padding: 16px; background: #f7f2e7; color: #2b1f14; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 28px; border-top: 2px solid #d8c9a8; padding-top: 16px; }
  form { display: grid; gap: 8px; margin: 12px 0; }
  input, select, textarea, button { font: inherit; padding: 10px; border: 1px solid #b9a77f; border-radius: 6px; }
  button { background: #a33b20; color: #fff; border: 0; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button.mini { background: #6b5b3e; padding: 6px 10px; font-size: .8rem; }
  ul { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #e5dcc5; align-items: center; }
  #estado { position: fixed; top: 0; left: 0; right: 0; background: #2b6b2f; color: #fff; padding: 8px; text-align: center; display: none; z-index: 9; }
  label.lbl { display: grid; gap: 4px; font-size: .85rem; font-weight: bold; }
</style>
</head>
<body>
<div id="estado"></div>
<h1>⚔️ Administración de eventos</h1>

<h2>Nueva ejecución</h2>
<form id="f-evento">
  <label class="lbl">Nombre del evento<select name="nombreEventoId" id="sel-nombre-evento" required></select></label>
  <label class="lbl">Partida<input name="partida" placeholder="Partida" required></label>
  <label class="lbl">Sistema de juego<select name="sistemaId" id="sel-sistema" required></select></label>
  <label class="lbl">Mazmorra (sede)<select name="sedeId" id="sel-sede" required></select></label>
  <label class="lbl">Narrador<select name="narradorId" id="sel-narrador" required></select></label>
  <label class="lbl">Fecha<input name="fecha" type="date" required></label>
  <label class="lbl">Hora<input name="hora" type="time" required></label>
  <label class="lbl">Descripción de la aventura<textarea name="descripcion" placeholder="Descripción de la aventura" rows="3" required></textarea></label>
  <label class="lbl">Foto (opcional)<input type="file" id="foto" accept="image/*"></label>
  <button>Crear evento</button>
</form>
<ul id="l-eventos"></ul>

<h2>Registros por evento</h2>
<select id="sel-evento-reg"></select>
<ul id="l-registros"></ul>

<h2>Sedes</h2>
<form id="f-sede">
  <select name="ciudadId" id="sel-ciudad" required></select>
  <input name="nombre" placeholder="Nombre de la sede" required>
  <input name="direccion" placeholder="Dirección" required>
  <input name="mapsUrl" type="url" placeholder="Enlace de Google Maps" required>
  <button>Crear sede</button>
</form>
<ul id="l-sedes"></ul>

<h2>Narradores</h2>
<form id="f-narrador"><input name="nombre" placeholder="Nombre" required><button>Crear</button></form>
<ul id="l-narradores"></ul>

<h2>Ciudades</h2>
<form id="f-ciudad"><input name="nombre" placeholder="Nombre" required><button>Crear</button></form>
<ul id="l-ciudades"></ul>

<h2>Nombres de eventos</h2>
<form id="f-nombre-evento"><input name="nombre" placeholder="Nombre del evento" required><button>Crear</button></form>
<ul id="l-nombres-eventos"></ul>

<h2>Sistemas de juego</h2>
<form id="f-sistema"><input name="nombre" placeholder="Nombre del sistema" required><button>Crear</button></form>
<ul id="l-sistemas"></ul>

<script>
let D = { ciudades: [], sedes: [], narradores: [], nombresEventos: [], sistemas: [], eventos: [], registros: [] };

function avisar(msj) {
  const e = document.getElementById('estado');
  e.textContent = msj; e.style.display = 'block';
  setTimeout(() => { e.style.display = 'none'; }, 2500);
}
function llamar(fn, ...args) {
  return new Promise((res, rej) =>
    google.script.run
      .withSuccessHandler(res)
      .withFailureHandler((e) => { avisar('Error: ' + e.message); rej(e); })[fn](...args));
}
async function recargar() { D = await llamar('panelDatos'); pintar(); }

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function nombreDe(lista, id) { const x = lista.find((f) => String(f.id) === String(id)); return x ? x.nombre : '¿?'; }
function opciones(sel, filas, texto) {
  sel.innerHTML = filas.map((f) => `<option value="${esc(f.id)}">${esc(texto(f))}</option>`).join('');
}
function lista(id, filas, texto, tabla, verbo = 'Borrar') {
  document.getElementById(id).innerHTML = filas.map((f) =>
    `<li><span>${esc(texto(f))}</span><button class="mini" onclick="borrar(this,'${tabla}','${esc(f.id)}')">${verbo}</button></li>`
  ).join('') || '<li>Sin datos.</li>';
}

function pintar() {
  opciones(document.getElementById('sel-ciudad'), D.ciudades, (f) => f.nombre);
  opciones(document.getElementById('sel-sede'), D.sedes, (f) => `${f.nombre} (${nombreDe(D.ciudades, f.ciudadId)})`);
  opciones(document.getElementById('sel-narrador'), D.narradores, (f) => f.nombre);
  opciones(document.getElementById('sel-nombre-evento'), D.nombresEventos, (f) => f.nombre);
  opciones(document.getElementById('sel-sistema'), D.sistemas, (f) => f.nombre);
  opciones(document.getElementById('sel-evento-reg'), D.eventos, (f) => `${f.partida} — ${nombreDe(D.nombresEventos, f.nombreEventoId)} — ${f.fecha}`);
  lista('l-ciudades', D.ciudades, (f) => f.nombre, 'ciudades');
  lista('l-narradores', D.narradores, (f) => f.nombre, 'narradores');
  lista('l-sedes', D.sedes, (f) => `${f.nombre} — ${nombreDe(D.ciudades, f.ciudadId)}`, 'sedes');
  lista('l-nombres-eventos', D.nombresEventos, (f) => f.nombre, 'nombresEventos');
  lista('l-sistemas', D.sistemas, (f) => f.nombre, 'sistemas');
  document.getElementById('l-eventos').innerHTML = D.eventos.map((f) =>
    `<li><span>${esc(`${f.partida} — ${nombreDe(D.nombresEventos, f.nombreEventoId)} — ${f.fecha} ${f.hora} — ${nombreDe(D.sedes, f.sedeId)}`)}</span>` +
    `<span><button class="mini" onclick="editarEvento('${esc(f.id)}')">Editar</button> ` +
    `<button class="mini" onclick="borrar(this,'eventos','${esc(f.id)}')">Borrar</button></span></li>`
  ).join('') || '<li>Sin datos.</li>';
  pintarRegistros();
}
function pintarRegistros() {
  const evId = document.getElementById('sel-evento-reg').value;
  const filas = D.registros.filter((r) => String(r.eventoId) === String(evId));
  document.getElementById('l-registros').innerHTML = filas.map((r) =>
    `<li><span>${esc(r.nombre)} · ${esc(r.telefono)} · ${esc(r.correo)}</span>` +
    `<button class="mini" onclick="borrar(this,'registros','${esc(r.id)}')">Liberar lugar</button></li>`
  ).join('') || '<li>Sin registros.</li>';
}
async function borrar(btn, tabla, id) {
  if (!confirm('¿Seguro? Esta acción no se puede deshacer.')) return;
  btn.disabled = true;
  try {
    await llamar('panelBorrar', tabla, id);
    avisar('Borrado.'); recargar();
  } finally {
    btn.disabled = false;
  }
}
document.getElementById('sel-evento-reg').onchange = pintarRegistros;

function alta(idForm, tabla, extra) {
  document.getElementById(idForm).onsubmit = async (ev) => {
    ev.preventDefault();
    const b = ev.target.querySelector('button:not(.mini)');
    b.disabled = true;
    try {
      const datos = Object.fromEntries(new FormData(ev.target));
      if (extra) Object.assign(datos, await extra());
      await llamar('panelCrear', tabla, datos);
      avisar('Guardado.'); ev.target.reset(); recargar();
    } finally {
      b.disabled = false;
    }
  };
}
alta('f-ciudad', 'ciudades');
alta('f-narrador', 'narradores');
alta('f-sede', 'sedes');
alta('f-nombre-evento', 'nombresEventos');
alta('f-sistema', 'sistemas');

// El formulario de evento tiene modo crear/editar propio (no usa alta()).
let editandoEventoId = null;
function editarEvento(id) {
  const ev = D.eventos.find((f) => String(f.id) === String(id));
  if (!ev) return;
  editandoEventoId = id;
  const f = document.getElementById('f-evento');
  ['nombreEventoId', 'partida', 'sistemaId', 'sedeId', 'narradorId', 'fecha', 'hora', 'descripcion'].forEach((c) => { f.elements[c].value = ev[c]; });
  f.querySelector('button:not(.mini)').textContent = 'Guardar cambios';
  f.scrollIntoView({ behavior: 'smooth' });
}
document.getElementById('f-evento').onsubmit = async (ev) => {
  ev.preventDefault();
  const b = ev.target.querySelector('button:not(.mini)');
  b.disabled = true;
  try {
    const datos = Object.fromEntries(new FormData(ev.target));
    const fotoUrl = await subirFotoSiHay();
    if (fotoUrl) datos.fotoUrl = fotoUrl; // sin foto nueva, panelEditar conserva la existente
    if (editandoEventoId) {
      await llamar('panelEditar', 'eventos', editandoEventoId, datos);
    } else {
      await llamar('panelCrear', 'eventos', datos);
    }
    editandoEventoId = null;
    b.textContent = 'Crear evento';
    avisar('Guardado.'); ev.target.reset(); recargar();
  } finally {
    b.disabled = false;
  }
};

recargar();

async function subirFotoSiHay() {
  const archivo = document.getElementById('foto').files[0];
  if (!archivo) return '';
  try {
    avisar('Subiendo foto…');
    const img = await createImageBitmap(archivo);
    // Lado más largo máx 1200px: cubre fotos anchas Y altas (una imagen muy alta
    // excedía el límite de lienzo del navegador y tronaba la subida).
    const escala = Math.min(1, 1200 / Math.max(img.width, img.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * escala);
    canvas.height = Math.round(img.height * escala);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
    return await llamar('panelGuardarFoto', dataUrl.split(',')[1], archivo.name.replace(/\.\w+$/, '') + '.jpg');
  } catch (err) {
    avisar('La foto no se pudo procesar (' + (err && err.message ? err.message : err) + '); el evento se guardará sin foto.');
    return '';
  }
}
</script>
</body>
</html>
